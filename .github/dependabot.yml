# Dependabot configuration.
# Weekly schedule for the npm ecosystem (development tooling).
# The deployed application loads CDN dependencies at runtime; those are
# reviewed by hand on a monthly cadence as recorded in docs/log.md.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /ci-tools/lint-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      lint-tools:
        patterns: ["*"]

  # Deliberate: added in the pilot for work folder 058 so Dependabot checks this folder.
  - package-ecosystem: npm
    directory: /ci-tools/accessibility-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      accessibility-tools:
        patterns: ["*"]
